                    results.rank3 = thirdMatch.winner.name;
                    results.rank4 = thirdMatch.loser.name;
                }

                return results;
            };

            const renderPodium = (title, data, icon) => {
                const ranks = getRankings(data);
                return (
                    <div className="glass-panel p-8 mb-10 overflow-hidden relative">
                        <div className="absolute top-0 right-0 p-10 opacity-5 pointer-events-none text-9xl">
                            {icon === 'pickleball' ? (
                                <img src="pickleball.png" alt="" className="icon-pickleball" />
                            ) : (
                                icon
                            )}
                        </div>
                        <h2 className="text-2xl font-black uppercase mb-8 flex items-center gap-3">
                            {icon === 'pickleball' ? (
                                <img src="pickleball.png" alt="" className="icon-pickleball" />
                            ) : (
                                <span>{icon}</span>
                            )} {title}
                        </h2>

                        <div className="podium-container">
                            {[
                                { rank: 2, name: ranks.rank2, label: 'Bạc', icon: '🥈' },
                                { rank: 1, name: ranks.rank1, label: 'Vàng', icon: '🥇' },
                                { rank: 3, name: ranks.rank3, label: 'Đồng', icon: '🥉' },
                                { rank: 4, name: ranks.rank4, label: 'Chì', icon: '🎗️' }
                            ].map(s => (
                                <div key={s.rank} className={`podium-spot rank-${s.rank}`}>
                                    <div className="medalist-name">{s.name || '???'}</div>
                                    <div className="medal-icon">{s.icon}</div>
                                    <div className="podium-base">
                                        <div className="text-2xl mb-1">{s.rank}</div>
                                        <div className="text-[10px] uppercase opacity-70 tracking-tighter">{s.label}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in space-y-4">
                    <div className="flex items-center gap-4 mb-2">
                        <h1 className="text-3xl font-black text-white italic uppercase tracking-wider">
                            👑 Bảng Vàng Thành Tích
                        </h1>
                        <div className="h-px flex-1 bg-gradient-to-r from-glass-border to-transparent"></div>
                    </div>
                    {renderPodium('Đơn Nam (Men\'s Singles)', msData, 'pickleball')}
                    {renderPodium('Đôi Nam-Nữ (Mixed Doubles)', mdData, '🤝')}

                    {/* Legend Section */}
                    <div className="glass-panel p-6 mt-10">
                        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                            <span>ℹ️</span> Giải thích ký hiệu:
                        </h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="flex items-center gap-2 text-sm">
                                <span className="text-2xl">🥇</span>
                                <span className="text-gray-300"><b className="text-yellow-400">Vàng:</b> Hạng 1 (Vô Địch)</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm">
                                <span className="text-2xl">🥈</span>
                                <span className="text-gray-300"><b className="text-gray-200">Bạc:</b> Hạng 2 (Á Quân)</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm">
                                <span className="text-2xl">🥉</span>
                                <span className="text-gray-300"><b className="text-orange-400">Đồng:</b> Hạng 3 (Thắng tranh 3)</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm">
                                <span className="text-2xl">🎗️</span>
                                <span className="text-gray-300"><b className="text-blue-400">Chì:</b> Hạng 4 (Thua tranh 3)</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── App ──────────────────────────────────────────────────────────────────
        const App = () => {
            const [role, setRole] = useState('landing'); // 'landing', 'admin', 'public'
            const [viewMode, setViewMode] = useState('admin');
            const [activeTab, setActiveTab] = useState('setup');
            const [password, setPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);

            const [players, setPlayers] = useState(normalizePlayers(INITIAL_PLAYERS));
            const [mdTeams, setMdTeams] = useState([]);
            const [initialized, setInitialized] = useState(false);
            const [matchConfig, setMatchConfig] = useState({ winSetsToWin: 3, pointsToWinSet: 11 });

            const [msData, setMsData] = useState({ rounds: [], matches: {} });
            const [mdData, setMdData] = useState({ rounds: [], matches: {} });

            useEffect(() => {
                fetch('http://localhost:3001/api/data')
                    .then(r => r.json())
                    .then(d => {
                        if (!d) return;
                        const lp = d.players;
                        if (lp?.men && lp?.women) setPlayers(normalizePlayers(lp));
                        if (d.mdTeams) setMdTeams(d.mdTeams);
                        if (d.msData) setMsData(d.msData);
                        if (d.mdData) setMdData(d.mdData);
                        if (d.initialized) setInitialized(d.initialized);
                        if (d.matchConfig) setMatchConfig({
                            winSetsToWin: normalizeWinSetsToWin(d.matchConfig.winSetsToWin),
                            pointsToWinSet: normalizePointsToWinSet(d.matchConfig.pointsToWinSet)
                        });
                    })
                    .catch(() => { });
            }, []);

            const timerRef = useRef(null);
            const generateTxt = () => {
                let txt = 'BÁO CÁO KẾT QUẢ GIẢI ĐẤU Pickleball PCB\n=================================\n\n';
                txt += '=== DANH SÁCH VĐV NAM ===\n';
                players.men.filter(p => p.name).forEach((p, i) => { txt += `${i + 1}. ${p.name} (Sức mạnh: ${rankToLabel(normalizeRank(p.rank))})\n`; });
                txt += '\n=== CÁC CẶP ĐÔI NAM-Nữ ===\n';
                mdTeams.forEach(t => { txt += `${t.name}\n`; });
                txt += '\n=== KẾT QUẢ TRẬN ĐẤU ===\n';
                const allMatches = { ...msData.matches, ...mdData.matches };
                Object.values(allMatches).forEach(m => {
                    if (m.isBye) return;
                    if (!m.team1 || !m.team2) return;
                    txt += `${m.name}: ${m.team1?.name} vs ${m.team2?.name}`;
                    if (m.scores?.length > 0) txt += ' | ' + m.scores.map(s => `${s.s1}-${s.s2}`).join(', ');
                    if (m.winner) txt += ` => ${m.winner.name} THẮNG`;
                    txt += '\n';
                });
                return txt;
            };

            useEffect(() => {
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(async () => {
                    try {
                        await fetch('http://localhost:3001/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                state: { players, mdTeams, msData, mdData, initialized, matchConfig },
                                txtReport: generateTxt()
                            })
                        });
                    } catch (e) { }
                }, 1500);
                return () => clearTimeout(timerRef.current);
            }, [players, mdTeams, msData, mdData, initialized, matchConfig]);

            const handlePlayerCountChange = (cat, val) => {
                const n = Math.max(2, parseInt(val) || 2);
                setPlayers(prev => {
                    const list = prev[cat];
                    if (n > list.length) {
                        const added = Array(n - list.length).fill(null).map((_, i) => ({
                            id: `${cat}_x${Date.now()}_${i}`, name: '', rank: 3
                        }));
                        return { ...prev, [cat]: [...list, ...added] };
                    }
                    return { ...prev, [cat]: list.slice(0, n) };
                });
            };

            const handlePlayerChange = (cat, idx, field, val) => {
                setPlayers(prev => {
                    const list = [...prev[cat]];
                    list[idx] = { ...list[idx], [field]: field === 'rank' ? normalizeRank(val) : val };
                    return { ...prev, [cat]: list };
                });
            };

            const initializeTournament = () => {
                const activeMen = players.men.filter(p => p.name.trim());
                const activeWomen = players.women.filter(p => p.name.trim());
                if (activeMen.length < 2) { alert('Cần ít nhất 2 VĐV Nam!'); return; }
                if (activeWomen.length < 2) { alert('Cần ít nhất 2 VĐV Nữ!'); return; }

                const ms = buildBracket(activeMen, 'ms', 'Đơn Nam');
                setMsData(ms);

                const teams = buildMdTeams(activeMen, activeWomen);
                setMdTeams(teams);
                const md = buildBracket(teams, 'md', 'Đôi Nam-Nữ');
                setMdData(md);

                setInitialized(true);
            };

            const saveMatchScore = (matchId, inputScores) => {
                const inMs = matchId in msData.matches;
                const data = inMs ? msData : mdData;
                const setData = inMs ? setMsData : setMdData;
                const winSetsToWin = normalizeWinSetsToWin(matchConfig?.winSetsToWin);
                const pointsToWinSet = normalizePointsToWinSet(matchConfig?.pointsToWinSet);
                const maxSets = winSetsToWin * 2 - 1;

                const matches = JSON.parse(JSON.stringify(data.matches));
                const match = matches[matchId];
                if (!match?.team1 || !match?.team2) return;

                let t1w = 0, t2w = 0;
                const scored = [];
                for (let i = 0; i < maxSets; i++) {
                    const s = inputScores[i];
                    if (!s || s.s1 === '' || s.s2 === '') break;
                    const v = validateScore(s.s1, s.s2, pointsToWinSet);
                    if (!v.valid) { alert(`Set ${i + 1}: ${v.msg}`); return; }
                    if (v.winner === 1) t1w++; else t2w++;
                    scored.push({ s1: parseInt(s.s1), s2: parseInt(s.s2), winner: v.winner });
                    if (t1w === winSetsToWin || t2w === winSetsToWin) break;
                }

                match.scores = scored;
                if (t1w === winSetsToWin || t2w === winSetsToWin) {
                    match.winner = t1w === winSetsToWin ? match.team1 : match.team2;
                    match.loser = t1w === winSetsToWin ? match.team2 : match.team1;

                    if (match.nextMatchId && matches[match.nextMatchId]) {
                        matches[match.nextMatchId][match.nextSlot] = match.winner;
                    }

                    const thirdId = Object.keys(matches).find(k => matches[k].round === 'third');
                    if (thirdId) {
                        const thirdMatch = matches[thirdId];
                        const sfIds = data.rounds[data.rounds.length - 2] || [];
                        if (sfIds.includes(matchId)) {
                            if (!thirdMatch.team1) thirdMatch.team1 = match.loser;
                            else if (!thirdMatch.team2) thirdMatch.team2 = match.loser;
                        }
                    }
                } else {
                    match.winner = null; match.loser = null;
                }

                setData(prev => ({ ...prev, matches }));
            };

            const simulateTournament = () => {
                const winSetsToWin = normalizeWinSetsToWin(matchConfig?.winSetsToWin);
                const pointsToWinSet = normalizePointsToWinSet(matchConfig?.pointsToWinSet);
                if (!initialized) { alert('Vui lòng khởi tạo giải đấu trước!'); return; }
                const runSim = (data, setter) => {
                    const matches = JSON.parse(JSON.stringify(data.matches));
                    let changed = false;
                    for (let iter = 0; iter < 10; iter++) {
                        let iterC = false;
                        Object.keys(matches).forEach(id => {
                            const m = matches[id];
                            if (m.isBye || m.winner || !m.team1 || !m.team2) return;
                            const scores = []; let w1 = 0, w2 = 0;
                            while (w1 < winSetsToWin && w2 < winSetsToWin) {
                                const winner = Math.random() < 0.5 ? 1 : 2;
                                const winnerScore = pointsToWinSet + Math.floor(Math.random() * 3);
                                const loserScore = Math.floor(Math.random() * winnerScore);
                                const s1 = winner === 1 ? winnerScore : loserScore;
                                const s2 = winner === 2 ? winnerScore : loserScore;
                                const v = validateScore(s1, s2, pointsToWinSet);
                                if (!v.valid) continue;
                                scores.push({ s1, s2, winner: v.winner });
                                if (v.winner === 1) w1++; else w2++;
                            }
                            m.scores = scores; m.winner = w1 === winSetsToWin ? m.team1 : m.team2; m.loser = w1 === winSetsToWin ? m.team2 : m.team1;
                            if (m.nextMatchId && matches[m.nextMatchId]) matches[m.nextMatchId][m.nextSlot] = m.winner;
                            const thirdId = Object.keys(matches).find(k => matches[k].round === 'third');
                            if (thirdId) {
                                const tm = matches[thirdId]; const sfIds = data.rounds[data.rounds.length - 2] || [];
                                if (sfIds.includes(id)) { if (!tm.team1) tm.team1 = m.loser; else if (!tm.team2) tm.team2 = m.loser; }
                            }
                            iterC = true; changed = true;
                        });
                        if (!iterC) break;
                    }
                    if (changed) setter(prev => ({ ...prev, matches }));
                };
                runSim(msData, setMsData); runSim(mdData, setMdData);
            };

            const exportData = () => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify({ players, mdTeams, msData, mdData, initialized, matchConfig }, null, 2)], { type: 'application/json' }));
                a.download = 'Pickleball PCB-data.json'; a.click();
            };
            const importData = () => {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
                inp.onchange = e => {
                    const fr = new FileReader();
                    fr.onload = ev => {
                        try {
                            const d = JSON.parse(ev.target.result);
                            if (d.players) setPlayers(normalizePlayers(d.players));
                            if (d.mdTeams) setMdTeams(d.mdTeams);
                            if (d.msData) setMsData(d.msData);
                            if (d.mdData) setMdData(d.mdData);
                            if (d.initialized !== undefined) setInitialized(d.initialized);
                            if (d.matchConfig) setMatchConfig({
                                winSetsToWin: normalizeWinSetsToWin(d.matchConfig.winSetsToWin),
                                pointsToWinSet: normalizePointsToWinSet(d.matchConfig.pointsToWinSet)
                            });
                            alert('Đã khôi phục dữ liệu!');
                        } catch { alert('File JSON lỗi!'); }
                    };
                    fr.readAsText(e.target.files[0]);
                };
                inp.click();
            };
            const resetAll = () => {
                if (!confirm('Xác nhận xóa toàn bộ dữ liệu?')) return;
                setPlayers(normalizePlayers(INITIAL_PLAYERS)); setMdTeams([]);
                setMsData({ rounds: [], matches: {} }); setMdData({ rounds: [], matches: {} });
                setMatchConfig({ winSetsToWin: 3, pointsToWinSet: 11 });
                setInitialized(false);
            };

            const handleLogin = () => {
                if (password === '1234') {
                    setRole('admin');
                    setViewMode('admin');
                    setActiveTab('setup');
                    setShowPasswordModal(false);
                } else {
                    alert('Sai mật khẩu! Vui lòng thử lại.');
                }
            };

            if (role === 'landing') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                        <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 animate-fade-in">
                            {/* Brand Section */}
                            <div className="flex flex-col justify-center items-center text-center md:text-left md:items-start p-8">
                                <div className="w-24 h-24 rounded-2xl bg-gradient-to-br from-primary to-accent flex items-center justify-center shadow-2xl mb-6 overflow-hidden">
                                    <img src="pickleball.png" alt="Pickleball PCB" className="icon-pickleball icon-pickleball-logo" />
                                </div>
                                <h1 className="text-5xl font-black text-white uppercase italic tracking-tighter leading-none mb-4">
                                    Pickleball <span className="text-primary italic block">PCB 2026</span>
                                </h1>
                                <p className="text-gray-400 text-lg max-w-sm">Hệ thống quản lý và trực tiếp kết quả giải đấu chuyên nghiệp.</p>
                            </div>

                            {/* Options Section */}
                            <div className="space-y-4 flex flex-col justify-center">
                                <button onClick={() => setShowPasswordModal(true)}
                                    className="glass-panel p-8 w-full text-left transition-all hover:scale-[1.02] hover:bg-white/10 group border-l-4 border-primary">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-2xl font-bold text-white group-hover:text-primary">⚙️ Admin Dashboard</span>
                                        <span className="text-gray-500">→</span>
                                    </div>
                                    <p className="text-sm text-gray-400">Dành cho ban tổ chức: Quản lý VĐV, bốc thăm và nhập điểm.</p>
                                </button>

                                <button onClick={() => { setRole('public'); setViewMode('public'); setActiveTab('bracket'); }}
                                    className="glass-panel p-8 w-full text-left transition-all hover:scale-[1.02] hover:bg-white/10 group border-l-4 border-accent">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-2xl font-bold text-white group-hover:text-accent">📺 Public View</span>
                                        <span className="text-gray-500">→</span>
                                    </div>
                                    <p className="text-sm text-gray-400">Dành cho khán giả: Xem lịch thi đấu, Bracket và Bảng vàng thành tích.</p>
                                </button>
                            </div>
                        </div>

                        {/* Password Modal */}
                        {showPasswordModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                                <div className="glass-panel p-8 max-w-sm w-full animate-pop-in">
                                    <h3 className="text-xl font-bold text-white mb-4">Mật khẩu Admin</h3>
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                                        onKeyPress={e => e.key === 'Enter' && handleLogin()}
                                        placeholder="Nhập PCB20..."
                                        className="w-full bg-slate-900 border border-glass-border rounded-lg p-3 text-white mb-6 focus:border-primary outline-none" autoFocus />
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowPasswordModal(false)} className="btn btn-ghost flex-1">Hủy</button>
                                        <button onClick={handleLogin} className="btn btn-primary flex-1">Xác nhận</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="max-w-[1400px] mx-auto p-4 md:p-8">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setRole('landing')} className="w-14 h-14 rounded-xl bg-gradient-to-br from-primary to-accent flex items-center justify-center shadow-lg hover:rotate-12 transition-transform overflow-hidden">
                                <img src="pickleball.png" alt="Pickleball PCB" className="icon-pickleball icon-pickleball-logo" />
                            </button>
                            <div>
                                <h1 className="text-2xl font-bold">Pickleball PCB Manager</h1>
                                <p className="text-sm text-text-muted">Giải Đấu Pickleball PCB mùa xuân</p>
                            </div>
                        </div>
                        <div className="flex gap-2 bg-slate-800/50 p-2 rounded-lg border border-glass-border flex-wrap">
                            {role === 'admin' && (
                                <button className={`btn text-sm ${viewMode === 'admin' ? 'bg-white/10 text-white' : 'btn-ghost'}`} onClick={() => setViewMode('admin')}>⚙️ Admin</button>
                            )}
                            <button className={`btn text-sm ${viewMode === 'public' ? 'bg-white/10 text-white' : 'btn-ghost'}`} onClick={() => setViewMode('public')}>📺 Public</button>
                            <div className="w-px bg-glass-border mx-1" />
                            <button onClick={() => setRole('landing')} className="btn btn-ghost text-sm">🚪 Thoát</button>

                            {viewMode === 'admin' && <>
                                <div className="w-px bg-glass-border mx-1" />
                                <span className="text-xs text-success flex items-center px-2 py-1 bg-success/10 rounded border border-success/30">🟢 Tự động lưu</span>
                                <button className="btn btn-ghost text-sm" onClick={exportData}>⬇️ JSON</button>
                                <button className="btn btn-primary text-sm shadow-none bg-blue-600" onClick={simulateTournament}>🎲 Mô Phỏng</button>
                                <button className="btn btn-ghost text-sm" onClick={importData}>⬆️ Nhập</button>
                                <button className="btn btn-danger text-sm" onClick={resetAll}>🗑️ Reset</button>
                            </>}
                        </div>
                    </div>

                    {/* Tabs */}
                    {(viewMode === 'admin' || viewMode === 'public') && (
                        <div className="flex border-b border-glass-border mb-8 overflow-x-auto">
                            {[
                                role === 'admin' ? ['setup', '1. Quản Lý'] : null,
                                role === 'admin' ? ['scoring', '2. Nhập Kết Quả'] : null,
                                ['bracket', '3. Lịch thi đấu'],
                                ['podium', '🏆 Thành Tích']
                            ].filter(Boolean).map(([k, label]) => (
                                <div key={k} className={`tab-btn whitespace-nowrap ${activeTab === k ? 'active' : ''}`} onClick={() => setActiveTab(k)}>{label}</div>
                            ))}
                        </div>
                    )}

                    {/* Content */}
                    <div className="min-h-[60vh]">
                        {viewMode === 'public' ? (
                            <div className="space-y-12">
                                <PodiumTab msData={msData} mdData={mdData} />
                                <BracketTab msData={msData} mdData={mdData} />
                            </div>
                        ) : (
                            <>
                                {activeTab === 'setup' && <SetupTab players={players} mdTeams={mdTeams} initialized={initialized} handlePlayerCountChange={handlePlayerCountChange} handlePlayerChange={handlePlayerChange} initializeTournament={initializeTournament} msData={msData} mdData={mdData} matchConfig={matchConfig} setMatchConfig={setMatchConfig} />}
                                {activeTab === 'scoring' && <ScoringTab msData={msData} mdData={mdData} saveMatchScore={saveMatchScore} matchConfig={matchConfig} />}
                                {activeTab === 'bracket' && <BracketTab msData={msData} mdData={mdData} />}
                                {activeTab === 'podium' && <PodiumTab msData={msData} mdData={mdData} />}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
